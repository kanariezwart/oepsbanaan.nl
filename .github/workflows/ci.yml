name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Lint — fast gate, runs in parallel with build                        #
  # ------------------------------------------------------------------ #
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install lint tools
        run: npm install --global eslint stylelint stylelint-config-standard

      - name: ESLint
        run: npx eslint -c build/config/eslint.config.mjs 'assets/site/js/**/*.js' 'build/tests/**/*.js'

      - name: Stylelint
        run: npx stylelint -c build/config/stylelint.config.cjs 'assets/site/css/**/*.css'

  # ------------------------------------------------------------------ #
  # Build — produces html/ artifact used by the playwright job           #
  # ------------------------------------------------------------------ #
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Cache the frontend-tools Docker image (Node/ESLint/terser/csso)
      - name: Restore frontend-tools image
        id: cache-tools
        uses: actions/cache@v5
        with:
          path: /tmp/docker-tools.tar
          key: docker-tools-${{ hashFiles('build/docker/Dockerfile.frontend-tools') }}

      # Cache the media-tools Docker image (ffmpeg/gifsicle/imagemagick)
      - name: Restore media-tools image
        id: cache-media
        uses: actions/cache@v5
        with:
          path: /tmp/docker-media.tar
          key: docker-media-${{ hashFiles('build/docker/Dockerfile.media-tools') }}

      - name: Load Docker images from cache
        run: |
          [ -f /tmp/docker-tools.tar ] && docker load -i /tmp/docker-tools.tar || true
          [ -f /tmp/docker-media.tar ] && docker load -i /tmp/docker-media.tar || true

      - name: Build frontend-tools image
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: docker build -f build/docker/Dockerfile.frontend-tools -t oepsbanaan-tools:node .

      - name: Build media-tools image
        if: steps.cache-media.outputs.cache-hit != 'true'
        run: docker build -f build/docker/Dockerfile.media-tools -t oepsbanaan-media:alpine .

      - name: Save Docker images to cache
        if: steps.cache-tools.outputs.cache-hit != 'true' || steps.cache-media.outputs.cache-hit != 'true'
        run: |
          [ -f /tmp/docker-tools.tar ] || docker save oepsbanaan-tools:node -o /tmp/docker-tools.tar
          [ -f /tmp/docker-media.tar ] || docker save oepsbanaan-media:alpine -o /tmp/docker-media.tar

      # Cache built media — GIFs/WebM/MP4 rarely change between commits.
      # Key covers source GIFs + scripts + Dockerfile so any change triggers a rebuild.
      - name: Restore built media (html/img)
        id: cache-html-img
        uses: actions/cache@v5
        with:
          path: html/img
          key: html-img-${{ hashFiles('assets/img/*.gif', 'build/scripts/build-video.sh', 'build/docker/Dockerfile.media-tools') }}

      # If media is cached, touch the stamp so make skips build-video.sh entirely.
      - name: Skip media stamp if html/img cached
        if: steps.cache-html-img.outputs.cache-hit == 'true'
        run: mkdir -p .stamps && touch .stamps/media.ok

      # Cache built favicons — only regenerated when source image or scripts change.
      - name: Restore built favicons
        id: cache-favicons
        uses: actions/cache@v5
        with:
          path: |
            html/favicons
            html/favicon.ico
          key: html-favicons-${{ hashFiles('assets/favicons/**', 'build/scripts/build-favicon.sh', 'build/docker/Dockerfile.media-tools') }}

      - name: Skip favicon stamp if cached
        if: steps.cache-favicons.outputs.cache-hit == 'true'
        run: mkdir -p .stamps && touch .stamps/favicon.ok

      - name: Build
        run: make build

      - name: Upload html artifact
        uses: actions/upload-artifact@v7
        with:
          name: html
          path: html/
          retention-days: 1

  # ------------------------------------------------------------------ #
  # Playwright — PR subset (chromium + webkit + iphone-13)               #
  # ------------------------------------------------------------------ #
  playwright-pr:
    name: Playwright (pr)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download html artifact
        uses: actions/download-artifact@v8
        with:
          name: html
          path: html/

      - name: Install Playwright deps
        working-directory: build/tests
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('build/tests/package.json') }}

      - name: Install Playwright browsers
        working-directory: build/tests
        run: npx playwright install --with-deps chromium webkit

      - name: Run PR tests
        env:
          CI: "1"
          PROJECT_SET: pr
          BASE_URL: http://127.0.0.1:8080
        run: |
          python3 -m http.server 8080 --directory html &
          # Wait until the server is ready (up to 10 s)
          for i in $(seq 1 100); do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null 2>&1 && break
            sleep 0.1
          done
          cd build/tests && npx playwright test --config playwright.config.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: build/tests/playwright-report/
          retention-days: 7
